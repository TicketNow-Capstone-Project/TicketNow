{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Admin Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b1a2d] text-white flex items-center justify-center min-h-screen">

<div class="bg-[#1a426f] p-8 rounded-lg shadow-lg w-96">
    <h1 class="text-2xl font-bold mb-6">Create Admin Account</h1>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username"
               class="w-full p-3 rounded bg-gray-800 border border-gray-600 mb-4" required>
        <input type="password" name="password" placeholder="Password"
               class="w-full p-3 rounded bg-gray-800 border border-gray-600 mb-4" required>

        <button type="submit"
                class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">
            Create
        </button>
    </form>

    <a href="{% url 'qrapp:accounts' %}"
       class="block text-center mt-4 text-gray-300 hover:underline">Back to Accounts</a>
</div>

</body>
</html>
