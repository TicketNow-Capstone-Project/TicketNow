{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accounts Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b1a2d] text-white">

<div class="p-8">

    <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Admin Accounts</h1>
    <a href="{% url 'qrapp:create_account' %}"
       class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded font-semibold">+ New Admin</a>
    </div>

    <table class="w-full text-left border border-gray-700">
        <thead class="bg-[#0056b3]">
            <tr>
                <th class="p-3">ID</th>
                <th class="p-3">Username</th>
                <th class="p-3">Created</th>
                <th class="p-3">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for admin in admins %}
            <tr class="border-b border-gray-600">
                <td class="p-3">{{ admin.id }}</td>
                <td class="p-3">{{ admin.username }}</td>
                <td class="p-3">{{ admin.created_at|date:"Y-m-d H:i" }}</td>
                <td class="p-3 space-x-3">
                    <a href="{% url 'qrapp:change_password' admin.id %}" 
                       class="bg-yellow-500 hover:bg-yellow-600 px-3 py-1 rounded">Change Password</a>
                    <a href="{% url 'qrapp:delete_account' admin.id %}" 
                       class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded"
                       onclick="return confirm('Are you sure you want to delete this account?')">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="p-3 text-center text-gray-400">No admin accounts yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
