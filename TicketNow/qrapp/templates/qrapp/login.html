{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | TicketNow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #1e293b;
      --accent: #1384b8;
      --accenture: #062838;
      --background: #0f172a87;
      --card-bg: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --success: #10b981;
      --warning: #f59e0b;
      --info: #3b82f6;
      --danger: #ef4444;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--secondary) 0%, var(--background) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    
    .login-card {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      padding: 30px;
      width: 100%;
      max-width: 380px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    
    .logo {
      height: 70px;
      width: 70px;
      border-radius: 50%;
      padding: 10px;
      background: white;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    }
    
    .title {
      color: var(--text-primary);
      font-weight: 600;
      font-size: 22px;
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }
    
    .form-group {
      margin-bottom: 18px;
    }
    
    .form-label {
      display: block;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 6px;
      font-size: 13px;
    }
    
    .input-container {
      position: relative;
    }
    
    .form-input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(15, 23, 42, 0.4);
      color: var(--text-primary);
      font-size: 15px;
      transition: all 0.2s ease;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(19, 132, 184, 0.2);
    }
    
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      font-size: 14px;
    }
    
    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
    }
    
    .password-toggle:hover {
      color: var(--accent);
    }
    
    .login-button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
      margin-top: 8px;
    }
    
    .login-button:hover {
      background: linear-gradient(to right, var(--primary-dark), var(--primary));
      box-shadow: 0 5px 12px rgba(37, 99, 235, 0.4);
    }
    
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--danger);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 13px;
      backdrop-filter: blur(5px);
    }
    
    .error-message p {
      margin: 0;
    }
    
    .footer-text {
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      margin-top: 20px;
    }
    
    .footer-text a {
      color: var(--accent);
      text-decoration: none;
    }
    
    .footer-text a:hover {
      text-decoration: underline;
    }
    
     .divider {
      display: flex;
      align-items: center;
      margin: 30px 0;
      color: var(--text-secondary);
      font-size: 14px;
    }
    
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }
    
    .divider::before {
      margin-right: 10px;
    }
    
    .divider::after {
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <!-- Logo -->
    <div class="logo-container">
      <img src="{% static 'qrapp/TICKETNOW_LOGO.png' %}" alt="TicketNow Logo" class="logo">
    </div>
    
    <h1 class="title">Admin Login</h1>
    
    {% if messages %}
      <div class="error-message">
        {% for message in messages %}
          <p><i class="fas fa-exclamation-circle mr-2"></i>{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
    
    <form method="post">
      {% csrf_token %}
      
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-container">
          <input type="text" name="username" class="form-input" placeholder="Enter username" required>
          <i class="fas fa-user input-icon"></i>
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-container">
          <input type="password" name="password" id="password" class="form-input" placeholder="••••••••" required>
          <i class="fas fa-lock input-icon"></i>
          <span class="password-toggle" id="passwordToggle">
            <i class="fas fa-eye"></i>
          </span>
        </div>
      </div>
      
      <button type="submit" class="login-button">
        <i class="fas fa-sign-in-alt mr-2"></i> Login
      </button>
    </form>

    <div class="divider">Secure Access</div>

  </div>

  <script>
    // Password visibility toggle
    const passwordToggle = document.getElementById('passwordToggle');
    const passwordInput = document.getElementById('password');
    
    passwordToggle.addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      
      // Toggle eye icon
      const eyeIcon = this.querySelector('i');
      eyeIcon.classList.toggle('fa-eye');
      eyeIcon.classList.toggle('fa-eye-slash');
    });
  </script>
</body>
</html>
