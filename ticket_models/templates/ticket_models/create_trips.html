 {% extends "ticket_models/base.html" %}
 {% block content %}
<!DOCTYPE html>
<html>
<head>
    <title>Add Trip</title>
</head>
<body>
{% if messages %}
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}

    <h1>Add Trip</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Trip</button>
    </form>
</body>
</html>

{% endblock %}
