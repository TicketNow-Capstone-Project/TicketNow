 {% extends "ticket_models/base.html" %}
 {% block content %}
 <h2>Create Ticket</h2>

{% if messages %}
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}

<form method="POST">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save Ticket</button>
</form>

{% endblock %}
