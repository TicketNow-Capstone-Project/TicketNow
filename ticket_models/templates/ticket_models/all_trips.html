 {% extends "ticket_models/base.html" %}
 {% block content %}
<!DOCTYPE html>
<html>
<head>
    <title>Trip List</title>
</head>
<body>
    <h1>All Trips</h1>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Trip Name</th>
            <th>Origin</th>
            <th>Destination</th>
        </tr>
        {% for trip in trips %}
        <tr>
            <td>{{ trip.trip_id }}</td>
            <td>{{ trip.trip_name }}</td>
            <td>{{ trip.origin }}</td>
            <td>{{ trip.destination }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>

{% endblock %}
